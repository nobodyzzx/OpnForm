map $request_uri $api_uri {
    ~^/api(/.*$) $1;
    default $request_uri;
}

server {
    listen 80;
    server_name opnform;
    root /usr/share/nginx/html/public;
    client_max_body_size ${NGINX_MAX_BODY_SIZE};

    access_log /dev/stdout;
    error_log /dev/stderr error;

    index index.html index.htm index.php;

    # Docker's embedded DNS (127.0.0.11) re-resolves service names on every
    # TTL expiry. Without this, nginx resolves opnform-client/opnform-api
    # ONCE at startup and caches the IP forever — if Dokploy recreates only
    # those containers (e.g. after an env change) without restarting this
    # ingress, it keeps talking to the old, now-dead IP until restarted by
    # hand. Using $variables in proxy_pass/fastcgi_pass (instead of bare
    # hostnames) is what makes nginx honor this resolver per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        proxy_http_version 1.1;
        set $client_upstream opnform-client;
        proxy_pass http://$client_upstream:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location ~/(api|open|local\/temp|forms\/assets)/ {
        set $original_uri $uri;
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $api_upstream opnform-api;
        fastcgi_pass $api_upstream:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI $api_uri;
        # Laravel accepts these headers only from IPs listed in TRUSTED_PROXIES.
        # This preserves the client IP behind an explicitly trusted reverse proxy.
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Deny access to . files
    location ~ /\. {
        deny all;
    }
}
